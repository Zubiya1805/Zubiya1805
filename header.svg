<svg width="900" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&amp;display=swap');
    </style>
    <linearGradient id="none" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="200" fill="#0d1117"/>

  <!-- top border line -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#30363d" stroke-width="1"/>

  <!-- decorative grid dots -->
  <g fill="#21262d">
    <rect x="20" y="20" width="2" height="2" rx="1"/>
    <rect x="40" y="20" width="2" height="2" rx="1"/>
    <rect x="60" y="20" width="2" height="2" rx="1"/>
    <rect x="20" y="40" width="2" height="2" rx="1"/>
    <rect x="40" y="40" width="2" height="2" rx="1"/>
    <rect x="20" y="60" width="2" height="2" rx="1"/>

    <rect x="840" y="140" width="2" height="2" rx="1"/>
    <rect x="860" y="140" width="2" height="2" rx="1"/>
    <rect x="880" y="140" width="2" height="2" rx="1"/>
    <rect x="840" y="160" width="2" height="2" rx="1"/>
    <rect x="860" y="160" width="2" height="2" rx="1"/>
    <rect x="840" y="180" width="2" height="2" rx="1"/>
    <rect x="860" y="180" width="2" height="2" rx="1"/>
    <rect x="880" y="180" width="2" height="2" rx="1"/>
  </g>

  <!-- left accent bar -->
  <rect x="44" y="50" width="3" height="100" fill="#58a6ff" rx="1"/>

  <!-- name -->
  <text x="60" y="105" font-family="'Courier New', monospace" font-size="58" font-weight="700" fill="#e6edf3" letter-spacing="-1">ZUBIYA SHAIKH</text>

  <!-- subtitle row -->
  <text x="62" y="135" font-family="'Courier New', monospace" font-size="13" fill="#8b949e" letter-spacing="3">DATA SCIENCE  ·  MACHINE LEARNING  ·  MUMBAI</text>

  <!-- small label top left -->
  <text x="62" y="70" font-family="'Courier New', monospace" font-size="10" fill="#58a6ff" letter-spacing="3">she/her  ·  open to work</text>

  <!-- bottom line -->
  <line x1="44" y1="158" x2="700" y2="158" stroke="#30363d" stroke-width="1"/>

  <!-- quote -->
  <text x="62" y="178" font-family="'Courier New', monospace" font-size="11" fill="#6e7681" font-style="italic">"Turning raw data into real decisions — one model at a time."</text>

  <!-- right corner tag -->
  <rect x="760" y="80" width="120" height="40" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="820" y="97" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" text-anchor="middle" letter-spacing="1">ALWAYS</text>
  <text x="820" y="111" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" text-anchor="middle" letter-spacing="1">LEARNING</text>
</svg>
