<svg width="900" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- bg -->
  <rect width="900" height="220" fill="#0d1117"/>

  <!-- scatter plot dots - data science motif, right side -->
  <g opacity="0.18" fill="#58a6ff">
    <circle cx="680" cy="40" r="3"/>
    <circle cx="710" cy="65" r="2"/>
    <circle cx="730" cy="30" r="4"/>
    <circle cx="755" cy="55" r="2"/>
    <circle cx="770" cy="80" r="3"/>
    <circle cx="790" cy="45" r="2"/>
    <circle cx="810" cy="70" r="4"/>
    <circle cx="830" cy="35" r="2"/>
    <circle cx="845" cy="60" r="3"/>
    <circle cx="860" cy="90" r="2"/>
    <circle cx="875" cy="50" r="3"/>
    <circle cx="690" cy="90" r="2"/>
    <circle cx="715" cy="105" r="3"/>
    <circle cx="740" cy="85" r="2"/>
    <circle cx="760" cy="110" r="4"/>
    <circle cx="785" cy="95" r="2"/>
    <circle cx="820" cy="100" r="3"/>
    <circle cx="850" cy="115" r="2"/>
    <circle cx="870" cy="75" r="2"/>
    <circle cx="885" cy="110" r="3"/>
  </g>

  <!-- trend line through scatter -->
  <line x1="670" y1="115" x2="890" y2="28" stroke="#58a6ff" stroke-width="1" opacity="0.12" stroke-dasharray="4,4"/>

  <!-- mini bar chart bottom right -->
  <g opacity="0.15" fill="#3fb950">
    <rect x="760" y="155" width="8" height="35" rx="1"/>
    <rect x="774" y="140" width="8" height="50" rx="1"/>
    <rect x="788" y="148" width="8" height="42" rx="1"/>
    <rect x="802" y="130" width="8" height="60" rx="1"/>
    <rect x="816" y="135" width="8" height="55" rx="1"/>
    <rect x="830" y="120" width="8" height="70" rx="1"/>
    <rect x="844" y="125" width="8" height="65" rx="1"/>
    <rect x="858" y="110" width="8" height="80" rx="1"/>
    <rect x="872" y="115" width="8" height="75" rx="1"/>
  </g>

  <!-- left accent bar - blue -->
  <rect x="44" y="44" width="3" height="132" fill="#58a6ff" rx="1"/>

  <!-- she/her label -->
  <text x="62" y="65" font-family="'Courier New',monospace" font-size="10" fill="#58a6ff" letter-spacing="3">SHE/HER  ·  OPEN TO WORK  ·  MUMBAI</text>

  <!-- main name -->
  <text x="60" y="125" font-family="'Courier New',monospace" font-size="62" font-weight="700" fill="#e6edf3" letter-spacing="0" filter="url(#softglow)">ZUBIYA SHAIKH</text>

  <!-- subtitle -->
  <text x="62" y="152" font-family="'Courier New',monospace" font-size="12" fill="#8b949e" letter-spacing="4">DATA SCIENCE  ·  MACHINE LEARNING  ·  POWER BI  ·  TABLEAU</text>

  <!-- divider -->
  <line x1="62" y1="168" x2="650" y2="168" stroke="#21262d" stroke-width="1"/>

  <!-- quote -->
  <text x="62" y="186" font-family="'Courier New',monospace" font-size="11" fill="#6e7681" font-style="italic">"Turning raw data into real decisions — one model at a time."</text>

  <!-- animated cursor blink -->
  <rect x="62" y="195" width="8" height="14" fill="#58a6ff" rx="1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
